server {
    listen 80;
    listen [::]:80;
    server_name xuanbai.tech www.xuanbai.tech;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        default_type text/plain;
        return 503 "玄白科技官网正在发布，请稍后刷新。\n";
    }
}
